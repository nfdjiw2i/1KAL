<!DOCTYPE html>
<html lang="ru" translate="no">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1.0"/>
<meta name="google" content="notranslate"/>
<title>INTEL CONNECT</title>
<link rel="preconnect" href="https://fonts.googleapis.com"/>
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin/>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet"/>
<style>
:root{
  --bg:#070707;--s1:#0e0e0e;--s2:#151515;--s3:#1a1a1a;--bd:#222;--bd2:#2a2a2a;
  --tx:#f0f0f0;--mu:#888;--mu2:#555;--gn:#22c55e;--rd:#ef4444;
  --online:#22c55e;--idle:#eab308;--dnd:#ef4444;--offline:#555;
}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:Inter,system-ui,sans-serif;background:var(--bg);color:var(--tx);height:100vh;overflow:hidden}
button,input,textarea,select{font-family:inherit}
::-webkit-scrollbar{width:5px}::-webkit-scrollbar-thumb{background:#333;border-radius:3px}

/* AUTH */
#authScreen{position:fixed;inset:0;background:var(--bg);display:flex;align-items:center;justify-content:center;z-index:1000;padding:20px}
.auth-box{width:100%;max-width:380px;background:var(--s1);border:1px solid var(--bd);border-radius:14px;padding:32px 28px}
.auth-logo{display:flex;align-items:center;gap:12px;margin-bottom:28px;justify-content:center}
.auth-logo .ic{width:36px;height:36px;border-radius:9px;background:var(--s2);border:1px solid var(--bd);display:grid;place-items:center;font-size:15px;color:var(--mu)}
.auth-logo span{font-family:'Space Grotesk',sans-serif;font-weight:700;font-size:15px;letter-spacing:.06em}
.auth-box h2{font-family:'Space Grotesk',sans-serif;font-size:1.35rem;font-weight:700;margin-bottom:6px;text-align:center}
.auth-box .sub{color:var(--mu);font-size:13px;text-align:center;margin-bottom:22px}
.fld{margin-bottom:14px}
.fld label{display:block;font-size:10px;letter-spacing:.1em;text-transform:uppercase;color:var(--mu);margin-bottom:5px}
.fld input{width:100%;background:var(--bg);border:1px solid var(--bd);border-radius:9px;padding:12px 14px;color:var(--tx);font-size:14px;outline:none}
.fld input:focus{border-color:#3a3a3a}
.btn{font-family:'Space Grotesk',sans-serif;font-weight:600;font-size:12px;letter-spacing:.05em;text-transform:uppercase;padding:13px 20px;border-radius:10px;border:1px solid #333;background:#222;color:#fff;cursor:pointer;width:100%;transition:.15s}
.btn:hover:not(:disabled){background:#2e2e2e}.btn:disabled{opacity:.4;cursor:not-allowed}
.btn-w{background:#fff;color:#000;border-color:#fff}.btn-w:hover:not(:disabled){background:#e8e8e8}
.auth-switch{text-align:center;margin-top:16px;font-size:13px;color:var(--mu)}
.auth-switch a{color:var(--tx);cursor:pointer;text-decoration:underline}
.auth-err{color:var(--rd);font-size:13px;text-align:center;margin-bottom:12px;min-height:18px;line-height:1.4}
.auth-ok{color:var(--gn);font-size:13px;text-align:center;margin-bottom:12px}

/* APP — sidebar like reference */
#app{display:none;height:100vh}
#app.on{display:flex}
.sidebar{width:220px;background:var(--s1);border-right:1px solid var(--bd);display:flex;flex-direction:column;flex-shrink:0}
.side-hdr{display:flex;align-items:center;gap:10px;padding:16px 14px;border-bottom:1px solid var(--bd)}
.side-hdr .logo-i{width:28px;height:28px;border-radius:8px;background:var(--s2);border:1px solid var(--bd);display:grid;place-items:center;font-size:13px;color:var(--mu);flex-shrink:0}
.side-hdr .logo-t{font-family:'Space Grotesk',sans-serif;font-weight:700;font-size:12px;letter-spacing:.06em}
.nav{flex:1;overflow-y:auto;padding:10px 10px 16px;display:flex;flex-direction:column;gap:3px}
.nav-label{font-size:10px;letter-spacing:.12em;text-transform:uppercase;color:var(--mu2);padding:10px 10px 6px;display:flex;justify-content:space-between;align-items:center}
.nav-label button{background:none;border:none;color:var(--mu2);cursor:pointer;font-size:14px;padding:0 2px}
.nav-label button:hover{color:#fff}
.nav-btn{display:flex;align-items:center;gap:10px;padding:9px 12px;border-radius:9px;cursor:pointer;color:var(--mu);font-size:13px;font-weight:500;border:none;background:transparent;width:100%;text-align:left;transition:.12s}
.nav-btn:hover{background:var(--s2);color:var(--tx)}
.nav-btn.on{background:#fff;color:#000}
.nav-btn .num{font-family:'JetBrains Mono',monospace;font-size:11px;opacity:.5;min-width:18px}
.user-bar{padding:12px;border-top:1px solid var(--bd);display:flex;align-items:center;gap:10px}
.user-bar .av{width:32px;height:32px;border-radius:50%;background:var(--s2);border:1px solid var(--bd);object-fit:cover;flex-shrink:0}
.user-bar .info{flex:1;min-width:0}
.user-bar .nm{font-size:13px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.user-bar .st{font-size:11px;color:var(--mu2);display:flex;align-items:center;gap:4px}
.user-bar .st .dot{width:7px;height:7px;border-radius:50%}
.user-bar .acts button{background:none;border:none;color:var(--mu);cursor:pointer;padding:4px;font-size:14px;border-radius:4px}
.user-bar .acts button:hover{background:var(--s2);color:var(--tx)}

/* MAIN */
.main{flex:1;display:flex;flex-direction:column;min-width:0;background:var(--bg)}
.chat-top{height:52px;border-bottom:1px solid var(--bd);display:flex;align-items:center;padding:0 18px;gap:10px;flex-shrink:0}
.chat-top .hash{color:var(--mu2);font-size:18px;font-family:'JetBrains Mono',monospace}
.chat-top .ch-title{font-family:'Space Grotesk',sans-serif;font-weight:600;font-size:15px}
.chat-top .ch-topic{font-size:12px;color:var(--mu);margin-left:6px}
.messages{flex:1;overflow-y:auto;padding:18px 18px 10px;display:flex;flex-direction:column}
.msg-load{text-align:center;padding:12px;color:var(--mu2);font-size:12px;cursor:pointer}
.msg-load:hover{color:var(--tx)}
.msg{display:flex;gap:12px;padding:6px 8px;border-radius:8px;margin-bottom:2px}
.msg:hover{background:rgba(255,255,255,.02)}
.msg .av{width:38px;height:38px;border-radius:50%;background:var(--s2);border:1px solid var(--bd);object-fit:cover;flex-shrink:0}
.msg .body{flex:1;min-width:0}
.msg .head{display:flex;align-items:baseline;gap:8px;margin-bottom:2px}
.msg .author{font-weight:600;font-size:14px}
.msg .time{font-size:11px;color:var(--mu2);font-family:'JetBrains Mono',monospace}
.msg .content{font-size:14px;line-height:1.45;word-wrap:break-word;white-space:pre-wrap}
.msg .content a{color:#aaa;text-decoration:underline}
.msg-day{text-align:center;margin:16px 0 8px;font-size:11px;color:var(--mu2);letter-spacing:.06em;text-transform:uppercase;position:relative}
.msg-day span{background:var(--bg);padding:0 12px;position:relative;z-index:1}
.msg-day::before{content:'';position:absolute;left:0;right:0;top:50%;height:1px;background:var(--bd)}
.composer{padding:0 16px 16px;flex-shrink:0}
.composer-box{background:var(--s1);border:1px solid var(--bd);border-radius:12px;padding:10px 12px;display:flex;align-items:flex-end;gap:8px}
.composer-box textarea{flex:1;background:transparent;border:none;color:var(--tx);font-size:14px;resize:none;outline:none;max-height:140px;line-height:1.4;padding:4px 0}
.composer-box .send{background:#fff;color:#000;border:none;border-radius:8px;padding:8px 14px;font-family:'Space Grotesk',sans-serif;font-weight:600;font-size:12px;cursor:pointer}
.composer-box .send:disabled{opacity:.35;cursor:not-allowed}
.attach-preview{padding:8px 12px 0;display:flex;gap:8px}
.attach-preview .ap{position:relative;width:56px;height:56px;border-radius:8px;overflow:hidden;border:1px solid var(--bd);background:var(--s2)}
.attach-preview .ap img{width:100%;height:100%;object-fit:cover}
.attach-preview .ap .rm{position:absolute;top:2px;right:2px;background:rgba(0,0,0,.75);border:none;color:#fff;width:16px;height:16px;border-radius:50%;cursor:pointer;font-size:10px;display:grid;place-items:center}

/* Members */
.members-panel{width:200px;background:var(--s1);border-left:1px solid var(--bd);display:flex;flex-direction:column;flex-shrink:0}
.members-panel .hd{padding:16px;font-size:10px;letter-spacing:.1em;text-transform:uppercase;color:var(--mu2);border-bottom:1px solid var(--bd)}
.members-list{flex:1;overflow-y:auto;padding:8px}
.mem-item{display:flex;align-items:center;gap:10px;padding:6px 8px;border-radius:8px}
.mem-item:hover{background:var(--s2)}
.mem-item .av{width:30px;height:30px;border-radius:50%;background:var(--s2);border:1px solid var(--bd);position:relative;overflow:hidden}
.mem-item .av img{width:100%;height:100%;object-fit:cover}
.mem-item .av .dot{position:absolute;bottom:-1px;right:-1px;width:9px;height:9px;border-radius:50%;border:2px solid var(--s1)}
.mem-item .nm{font-size:13px;font-weight:500;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.mem-item .role{font-size:10px;color:var(--mu2)}

/* Modals */
.modal-bg{position:fixed;inset:0;background:rgba(0,0,0,.7);z-index:500;display:none;align-items:center;justify-content:center;padding:20px}
.modal-bg.on{display:flex}
.modal{background:var(--s1);border:1px solid var(--bd);border-radius:14px;padding:24px;max-width:420px;width:100%}
.modal h3{font-family:'Space Grotesk',sans-serif;font-size:1.15rem;font-weight:700;margin-bottom:16px}
.modal .actions{display:flex;gap:8px;justify-content:flex-end;margin-top:20px}
.modal .actions .btn{width:auto;padding:10px 16px}

.toast{position:fixed;bottom:24px;left:50%;transform:translateX(-50%);background:var(--s2);border:1px solid var(--bd2);border-radius:10px;padding:12px 20px;font-size:13px;z-index:999;display:none;box-shadow:0 8px 32px rgba(0,0,0,.5)}
.toast.on{display:block}
.empty{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;color:var(--mu);padding:40px;text-align:center}
.empty h3{font-family:'Space Grotesk',sans-serif;font-size:1.25rem;color:var(--tx);margin-bottom:8px}
.empty p{font-size:13px;max-width:300px;line-height:1.5}

@media(max-width:900px){.members-panel{display:none}}
@media(max-width:700px){.sidebar{width:64px}.sidebar .logo-t,.sidebar .nav-btn .lbl,.sidebar .nav-label span,.user-bar .info{display:none}.nav-btn{justify-content:center}}

.msg.pending{opacity:.55}
.msg.pending .send-status{font-size:11px;color:var(--mu2);margin-left:6px;font-family:'JetBrains Mono',monospace}
.msg.failed{opacity:.7}
.msg.failed .send-status{color:var(--rd)}
.msg{animation:msgIn .18s ease}
@keyframes msgIn{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
</style>
</head>
<body>

<div id="authScreen">
  <div class="auth-box">
    <div class="auth-logo"><div class="ic">◎</div><span>INTEL CONNECT</span></div>
    <h2 id="authTitle">Вход</h2>
    <p class="sub" id="authSub">Ник и пароль</p>
    <div class="auth-err" id="authErr"></div>
    <div class="auth-ok" id="authOk"></div>
    <div class="fld"><label>Ник</label><input id="authNick" type="text" placeholder="nickname" maxlength="24" autocomplete="username"/></div>
    <div class="fld"><label>Пароль</label><input id="authPass" type="password" placeholder="••••••••" maxlength="64" autocomplete="current-password"/></div>
    <div class="fld" id="pass2Fld" style="display:none"><label>Повторите пароль</label><input id="authPass2" type="password" placeholder="••••••••" maxlength="64"/></div>
    <button class="btn btn-w" id="btnAuth" onclick="doAuth()">Войти</button>
    <div class="auth-switch" id="authSwitch">Нет аккаунта? <a onclick="toggleAuthMode()">Регистрация</a></div>
  </div>
</div>

<div id="app">
  <div class="sidebar">
    <div class="side-hdr">
      <div class="logo-i">◎</div>
      <div class="logo-t">INTEL CONNECT</div>
    </div>
    <div class="nav" id="channelNav">
      <div class="nav-label"><span>Каналы</span><button id="btnAddCh" title="Создать канал" onclick="openCreateChannel()" style="display:none">+</button></div>
    </div>
    <div class="user-bar">
      <img class="av" id="myAv" src="" alt=""/>
      <div class="info">
        <div class="nm" id="myName">—</div>
        <div class="st"><span class="dot" id="myDot" style="background:var(--online)"></span><span id="myStatus">Online</span></div>
      </div>
      <div class="acts">
        <button title="Профиль" onclick="openProfile()">⚙</button>
        <button title="Выйти" onclick="logout()">⏻</button>
      </div>
    </div>
  </div>

  <div class="main">
    <div class="chat-top">
      <span class="hash">#</span>
      <span class="ch-title" id="curChannelName">general</span>
      <span class="ch-topic" id="curChannelTopic"></span>
    </div>
    <div class="messages" id="messages" onscroll="onMessagesScroll()">
      <div class="empty" id="emptyState"><h3>INTEL CONNECT</h3><p>Загрузка…</p></div>
    </div>
    <div class="composer" id="composer" style="display:none">
      <div class="attach-preview" id="attachPreview"></div>
      <div class="composer-box">
        <button onclick="document.getElementById('fileInput').click()" style="background:none;border:none;color:var(--mu);cursor:pointer;padding:6px;font-size:18px" title="Файл">＋</button>
        <textarea id="msgInput" rows="1" placeholder="Написать сообщение…" onkeydown="onComposerKey(event)" oninput="autoGrow(this)"></textarea>
        <button class="send" id="sendBtn" onclick="sendMessage()">Отправить</button>
      </div>
      <input type="file" id="fileInput" accept="image/*,.pdf,.txt,.zip" style="display:none" onchange="onFileSelected(event)"/>
    </div>
  </div>

  <div class="members-panel">
    <div class="hd">Онлайн — <span id="memberCount">0</span></div>
    <div class="members-list" id="membersList"></div>
  </div>
</div>

<div class="modal-bg" id="modalCreateChannel">
  <div class="modal">
    <h3>Новый канал</h3>
    <div class="fld"><label>Название</label><input id="newChannelName" type="text" placeholder="general" maxlength="32"/></div>
    <div class="actions">
      <button class="btn" onclick="closeModal('modalCreateChannel')">Отмена</button>
      <button class="btn btn-w" onclick="createChannel()">Создать</button>
    </div>
  </div>
</div>
<div class="modal-bg" id="modalProfile">
  <div class="modal">
    <h3>Профиль</h3>
    <div class="fld"><label>Отображаемое имя</label><input id="profName" type="text" maxlength="32"/></div>
    <div class="fld"><label>URL аватара</label><input id="profAvatar" type="url" placeholder="https://..."/></div>
    <div class="actions">
      <button class="btn" onclick="closeModal('modalProfile')">Отмена</button>
      <button class="btn btn-w" onclick="saveProfile()">Сохранить</button>
    </div>
  </div>
</div>
<div class="toast" id="toast"></div>

<script>
/* ========== CONFIG ========== */
const FB_BASE = 'https://intell-a2b60-default-rtdb.firebaseio.com';
const FB_SECRET = 'x4aVe5AMCLlhGP0rMQfIMzI9qFyKErbFZULo49eP';
/* Ник владельца — только он создаёт каналы. Поставь свой ник: */
const OWNER_NICK = 'SStwendRT';
const PAGE_SIZE = 30;
const POLL_MS = 2500;

function fbUrl(path){
  const p = path.startsWith('/') ? path : '/' + path;
  const base = p.includes('.json') ? FB_BASE + p : FB_BASE + p + '.json';
  return base + (base.includes('?') ? '&' : '?') + 'auth=' + encodeURIComponent(FB_SECRET);
}
async function fbGet(path){
  const r = await fetch(fbUrl(path), { cache:'no-store' });
  if(!r.ok) throw new Error('Сеть ' + r.status);
  return r.json();
}
async function fbSet(path, data){
  const r = await fetch(fbUrl(path), { method:'PUT', headers:{'Content-Type':'application/json'}, body:JSON.stringify(data) });
  if(!r.ok) throw new Error('Запись ' + r.status);
  return r.json();
}
async function fbUpdate(path, data){
  const r = await fetch(fbUrl(path), { method:'PATCH', headers:{'Content-Type':'application/json'}, body:JSON.stringify(data) });
  if(!r.ok) throw new Error('Обновление ' + r.status);
  return r.json();
}
async function fbPush(path, data){
  const r = await fetch(fbUrl(path), { method:'POST', headers:{'Content-Type':'application/json'}, body:JSON.stringify(data) });
  if(!r.ok) throw new Error('Отправка ' + r.status);
  return r.json();
}
async function fbQuery(path, params){
  const q = Object.entries(params).map(([k,v]) => k + '=' + encodeURIComponent(v)).join('&');
  const url = FB_BASE + '/' + path + '.json?auth=' + encodeURIComponent(FB_SECRET) + '&' + q;
  const r = await fetch(url, { cache:'no-store' });
  if(!r.ok) throw new Error('Запрос ' + r.status);
  return r.json();
}

let me = null;
let channels = {};
let currentChannelId = null;
let messages = [];
let oldestTs = null;
let hasMore = true;
let loadingOlder = false;
let pendingAttach = null;
let authMode = 'login';
let authBusy = false;
let pollTimer = null;
let lastMsgTs = 0;
let onlineUsers = {};

function $(id){ return document.getElementById(id); }
function toast(t, ms=3000){ const el=$('toast'); el.textContent=t; el.classList.add('on'); clearTimeout(el._t); el._t=setTimeout(()=>el.classList.remove('on'), ms); }
function uid(){ return 'u_'+Math.random().toString(36).slice(2,10)+Date.now().toString(36); }
function esc(s){ return String(s==null?'':s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;'); }
function fmtTime(ts){
  if(!ts) return '';
  const d=new Date(ts), n=new Date();
  if(d.toDateString()===n.toDateString()) return d.toLocaleTimeString('ru-RU',{hour:'2-digit',minute:'2-digit'});
  return d.toLocaleDateString('ru-RU',{day:'numeric',month:'short'})+' '+d.toLocaleTimeString('ru-RU',{hour:'2-digit',minute:'2-digit'});
}
function dayKey(ts){ const d=new Date(ts); return d.getFullYear()+'-'+(d.getMonth()+1)+'-'+d.getDate(); }
function isOwner(){ return me && (me.username||'').toLowerCase() === OWNER_NICK.toLowerCase(); }

function simpleHash(str){
  let h=2166136261,h2=0x811c9dc5;
  for(let i=0;i<str.length;i++){ h^=str.charCodeAt(i); h=Math.imul(h,16777619); }
  for(let i=str.length-1;i>=0;i--){ h2^=str.charCodeAt(i); h2=Math.imul(h2,16777619); }
  let out=(h>>>0).toString(16).padStart(8,'0')+(h2>>>0).toString(16).padStart(8,'0');
  for(let r=0;r<3;r++){ let x=0; for(let i=0;i<out.length;i++) x=Math.imul(x^out.charCodeAt(i),0x01000193); out+=(x>>>0).toString(16).padStart(8,'0'); }
  return out;
}
async function hashPassword(password, salt){
  try{
    if(window.crypto && crypto.subtle){
      const buf=new TextEncoder().encode(salt+'::'+password+'::intel');
      const hash=await crypto.subtle.digest('SHA-256', buf);
      return Array.from(new Uint8Array(hash)).map(b=>b.toString(16).padStart(2,'0')).join('');
    }
  }catch(e){}
  return simpleHash(salt+'::'+password+'::intel');
}
function makeSalt(){
  try{
    if(window.crypto && crypto.getRandomValues){
      const a=new Uint8Array(16); crypto.getRandomValues(a);
      return Array.from(a).map(b=>b.toString(16).padStart(2,'0')).join('');
    }
  }catch(e){}
  return Math.random().toString(36).slice(2)+Date.now().toString(36);
}

function toggleAuthMode(){
  if(authBusy) return;
  authMode = authMode==='login'?'register':'login';
  $('authTitle').textContent = authMode==='login'?'Вход':'Регистрация';
  $('authSub').textContent = authMode==='login'?'Ник и пароль':'Создайте аккаунт';
  $('pass2Fld').style.display = authMode==='register'?'block':'none';
  $('btnAuth').textContent = authMode==='login'?'Войти':'Зарегистрироваться';
  $('authSwitch').innerHTML = authMode==='login'
    ? 'Нет аккаунта? <a onclick="toggleAuthMode()">Регистрация</a>'
    : 'Уже есть? <a onclick="toggleAuthMode()">Вход</a>';
  $('authErr').textContent=''; $('authOk').textContent='';
  $('authPass').value=''; $('authPass2').value='';
}

async function doAuth(){
  if(authBusy) return;
  const nick=$('authNick').value.trim(), pass=$('authPass').value, pass2=$('authPass2').value;
  $('authErr').textContent=''; $('authOk').textContent='';
  if(!nick||nick.length<2){ $('authErr').textContent='Ник минимум 2 символа'; return; }
  if(!/^[a-zA-Z0-9_\-а-яёА-ЯЁ]+$/.test(nick)){ $('authErr').textContent='Ник: буквы, цифры, _ -'; return; }
  if(!pass||pass.length<4){ $('authErr').textContent='Пароль минимум 4 символа'; return; }
  if(authMode==='register'&&pass!==pass2){ $('authErr').textContent='Пароли не совпадают'; return; }

  authBusy=true;
  const btn=$('btnAuth'); btn.disabled=true;
  btn.textContent=authMode==='login'?'Вход…':'Регистрация…';
  const nickKey=nick.toLowerCase();

  try{
    if(authMode==='register'){
      const existing=await fbGet('usernames/'+nickKey);
      if(existing){ $('authErr').textContent='Ник занят'; return; }
      const salt=makeSalt(), passwordHash=await hashPassword(pass,salt), userId=uid();
      const userData={ username:nick, displayName:nick, passwordHash, salt, avatar:'', status:'online', createdAt:Date.now(), lastLogin:Date.now() };
      await fbSet('users/'+userId, userData);
      await fbSet('usernames/'+nickKey, userId);
      me={ uid:userId, ...userData };
      try{ localStorage.setItem('ic_session', JSON.stringify({ uid:userId, ts:Date.now() })); }catch(e){}
      $('authOk').textContent='Готово!';
      enterApp();
    }else{
      const userId=await fbGet('usernames/'+nickKey);
      if(!userId){ $('authErr').textContent='Пользователь не найден'; return; }
      const userData=await fbGet('users/'+userId);
      if(!userData||!userData.passwordHash){ $('authErr').textContent='Ошибка данных'; return; }
      const check=await hashPassword(pass, userData.salt);
      if(check!==userData.passwordHash){ $('authErr').textContent='Неверный пароль'; return; }
      try{ await fbUpdate('users/'+userId, { status:'online', lastLogin:Date.now() }); }catch(e){}
      me={ uid:userId, ...userData, status:'online' };
      try{ localStorage.setItem('ic_session', JSON.stringify({ uid:userId, ts:Date.now() })); }catch(e){}
      enterApp();
    }
  }catch(e){
    console.error(e);
    $('authErr').textContent='Ошибка: '+(e.message||e);
  }finally{
    authBusy=false; btn.disabled=false;
    btn.textContent=authMode==='login'?'Войти':'Зарегистрироваться';
  }
}

async function tryRestoreSession(){
  try{
    const raw=localStorage.getItem('ic_session');
    if(!raw) return false;
    const s=JSON.parse(raw);
    if(!s.uid||Date.now()-s.ts>30*24*60*60*1000) return false;
    const u=await fbGet('users/'+s.uid);
    if(!u) return false;
    me={ uid:s.uid, ...u };
    try{ await fbUpdate('users/'+s.uid, { status:'online', lastLogin:Date.now() }); }catch(e){}
    return true;
  }catch(e){ return false; }
}

function logout(){
  if(me) fbUpdate('users/'+me.uid, { status:'offline' }).catch(()=>{});
  localStorage.removeItem('ic_session');
  me=null; stopPoll(); location.reload();
}

async function enterApp(){
  $('authScreen').style.display='none';
  $('app').classList.add('on');
  $('myName').textContent=me.displayName||me.username||'User';
  $('myStatus').textContent=me.status||'online';
  $('myDot').style.background='var(--online)';
  $('myAv').src=me.avatar||('https://api.dicebear.com/7.x/identicon/svg?seed='+encodeURIComponent(me.uid));
  if(isOwner()) $('btnAddCh').style.display='inline';
  await ensureDefaultChannel();
  await loadChannels();
  loadOnline();
  setInterval(loadOnline, 15000);
}

async function ensureDefaultChannel(){
  const chs=await fbGet('channels')||{};
  if(!Object.keys(chs).length){
    await fbSet('channels/ch_general', { name:'general', topic:'Общий чат', position:0, createdAt:Date.now() });
  }
}

async function loadChannels(){
  channels=await fbGet('channels')||{};
  renderChannelNav();
  const sorted=Object.entries(channels).sort((a,b)=>(a[1].position||0)-(b[1].position||0));
  if(sorted.length) selectChannel(sorted[0][0]);
}

function renderChannelNav(){
  const nav=$('channelNav');
  const label=nav.querySelector('.nav-label');
  nav.innerHTML='';
  nav.appendChild(label);
  const sorted=Object.entries(channels).sort((a,b)=>(a[1].position||0)-(b[1].position||0));
  sorted.forEach(([id,ch],i)=>{
    const btn=document.createElement('button');
    btn.className='nav-btn'+(id===currentChannelId?' on':'');
    btn.innerHTML='<span class="num">'+String(i+1).padStart(2,'0')+'</span><span class="lbl">'+esc(ch.name)+'</span>';
    btn.onclick=()=>selectChannel(id);
    nav.appendChild(btn);
  });
}

function openCreateChannel(){
  if(!isOwner()){ toast('Только владелец может создавать каналы'); return; }
  openModal('modalCreateChannel');
  $('newChannelName').value='';
  setTimeout(()=>$('newChannelName').focus(),30);
}

async function createChannel(){
  if(!isOwner()){ toast('Нет прав'); return; }
  let name=$('newChannelName').value.trim().toLowerCase().replace(/\s+/g,'-').replace(/[^a-z0-9\-_а-яё]/gi,'');
  if(!name) return;
  const chId='ch_'+Math.random().toString(36).slice(2,8);
  const ch={ name, topic:'', position:Date.now(), createdAt:Date.now() };
  try{
    await fbSet('channels/'+chId, ch);
    channels[chId]=ch;
    closeModal('modalCreateChannel');
    renderChannelNav();
    selectChannel(chId);
    toast('Канал #'+name+' создан');
  }catch(e){ toast(e.message); }
}

function selectChannel(chId){
  currentChannelId=chId;
  const ch=channels[chId]||{};
  $('curChannelName').textContent=ch.name||'channel';
  $('curChannelTopic').textContent=ch.topic||'';
  $('msgInput').placeholder='Написать в #'+(ch.name||'канал')+'…';
  renderChannelNav();
  $('composer').style.display='block';
  const empty=$('emptyState'); if(empty) empty.remove();
  messages=[]; oldestTs=null; hasMore=true; loadingOlder=false; lastMsgTs=0;
  stopPoll();
  $('messages').innerHTML='<div class="msg-load" id="loadOlder">Загрузка…</div>';
  loadMessages(true).then(()=>{
    pollTimer=setInterval(pollNewMessages, POLL_MS);
  });
}

function stopPoll(){ if(pollTimer){ clearInterval(pollTimer); pollTimer=null; } }

async function loadMessages(initial){
  if(!currentChannelId) return;
  try{
    // Без orderBy — индекс в Rules не нужен. Сортируем на клиенте.
    const raw = await fbGet('messages/'+currentChannelId) || {};
    let all = Object.entries(raw).map(([key,v])=>({key,...v}))
      .sort((a,b)=>(a.createdAt||0)-(b.createdAt||0));
    hasMore = false;
    if(all.length){
      oldestTs = all[0].createdAt;
      lastMsgTs = all[all.length-1].createdAt;
    }
    messages = all;
    renderMessages(true);
    const el=$('loadOlder');
    if(el){ el.textContent = all.length ? 'Начало переписки' : 'Пока нет сообщений'; el.onclick = null; }
  }catch(e){
    console.error(e); toast('Ошибка загрузки: '+e.message);
    const el=$('loadOlder'); if(el) el.textContent='Ошибка загрузки';
  }
}

async function pollNewMessages(){
  if(!currentChannelId) return;
  try{
    const raw = await fbGet('messages/'+currentChannelId) || {};
    const all = Object.entries(raw).map(([key,v])=>({key,...v}))
      .sort((a,b)=>(a.createdAt||0)-(b.createdAt||0));
    for(const m of all){
      if(messages.some(x=>x.key===m.key)) continue;
      // только новые
      if((m.createdAt||0) <= (lastMsgTs||0) && messages.length) continue;
      messages.push(m);
      appendMessage(m, true);
      if(m.createdAt > lastMsgTs) lastMsgTs = m.createdAt;
    }
    // sync lastMsgTs
    if(all.length){
      const maxTs = all[all.length-1].createdAt || 0;
      if(maxTs > lastMsgTs) lastMsgTs = maxTs;
    }
  }catch(e){}
}

function loadOlder(){ if(loadingOlder||!hasMore) return; loadingOlder=true; const el=$('loadOlder'); if(el) el.textContent='Загрузка…'; loadMessages(false).finally(()=>{loadingOlder=false}); }
function onMessagesScroll(){ const box=$('messages'); if(box.scrollTop<80&&hasMore&&!loadingOlder) loadOlder(); }

function renderMessages(scrollBottom){
  const box=$('messages');
  let html='<div class="msg-load" id="loadOlder">'+(hasMore?'↑ Загрузить ещё':'Начало')+'</div>';
  let lastDay='';
  for(const m of messages){
    const dk=dayKey(m.createdAt);
    if(dk!==lastDay){ lastDay=dk; const d=new Date(m.createdAt); html+='<div class="msg-day" data-day="'+dk+'"><span>'+d.toLocaleDateString('ru-RU',{day:'numeric',month:'long',year:'numeric'})+'</span></div>'; }
    html+=messageHtml(m);
  }
  box.innerHTML=html;
  if($('loadOlder')&&hasMore) $('loadOlder').onclick=()=>loadOlder();
  if(scrollBottom) box.scrollTop=box.scrollHeight;
}

function appendMessage(m, scroll){
  const box=$('messages');
  const dk=dayKey(m.createdAt);
  if(!box.querySelector('.msg-day[data-day="'+dk+'"]')){
    const d=new Date(m.createdAt); const div=document.createElement('div');
    div.className='msg-day'; div.dataset.day=dk;
    div.innerHTML='<span>'+d.toLocaleDateString('ru-RU',{day:'numeric',month:'long',year:'numeric'})+'</span>';
    box.appendChild(div);
  }
  const wrap=document.createElement('div'); wrap.innerHTML=messageHtml(m);
  box.appendChild(wrap.firstElementChild);
  if(scroll) box.scrollTop=box.scrollHeight;
}

function messageHtml(m){
  const av=m.avatar||('https://api.dicebear.com/7.x/identicon/svg?seed='+encodeURIComponent(m.authorId||'x'));
  let attach='';
  if(m.attach&&m.attach.type&&m.attach.type.indexOf('image/')===0){
    attach='<div class="attach" style="margin-top:8px"><img src="'+esc(m.attach.url)+'" style="max-width:320px;border-radius:8px;border:1px solid var(--bd);cursor:pointer" onclick="window.open(this.src)"/></div>';
  }else if(m.attach){
    attach='<div style="margin-top:6px"><a href="'+esc(m.attach.url)+'" target="_blank" rel="noopener" style="color:#aaa">'+esc(m.attach.name||'Файл')+'</a></div>';
  }
  let content=esc(m.content||'');
  content=content.replace(/(https?:\/\/[^\s<]+)/g,'<a href="$1" target="_blank" rel="noopener">$1</a>');
  return '<div class="msg" data-key="'+esc(m.key)+'"><img class="av" src="'+esc(av)+'" alt=""/><div class="body"><div class="head"><span class="author">'+esc(m.authorName||'User')+'</span><span class="time">'+fmtTime(m.createdAt)+'</span></div><div class="content">'+content+'</div>'+attach+'</div></div>';
}

async function sendMessage(){
  const text=$('msgInput').value.trim();
  if(!text&&!pendingAttach) return;
  if(!currentChannelId) return;
  const btn=$('sendBtn'); btn.disabled=true;

  const msg={
    authorId:me.uid,
    authorName:me.displayName||me.username||'User',
    avatar:me.avatar||'',
    content:text,
    createdAt:Date.now(),
    attach:null
  };
  if(pendingAttach){
    if(pendingAttach.dataUrl.length>900000){ toast('Файл слишком большой'); btn.disabled=false; return; }
    msg.attach={ type:pendingAttach.type, name:pendingAttach.name, size:pendingAttach.size, url:pendingAttach.dataUrl };
  }

  // Мгновенно показываем сообщение (optimistic UI)
  const tempKey = 'temp_'+Date.now()+'_'+Math.random().toString(36).slice(2,6);
  const optimistic = { key: tempKey, ...msg, _pending: true };
  messages.push(optimistic);
  appendMessage(optimistic, true);
  markPending(tempKey, true);

  $('msgInput').value=''; autoGrow($('msgInput')); clearAttach();
  $('msgInput').focus();

  try{
    const res = await fbPush('messages/'+currentChannelId, msg);
    const key = res.name;
    // Заменяем временное на реальное
    const idx = messages.findIndex(m => m.key === tempKey);
    if(idx >= 0){
      messages[idx] = { key, ...msg };
      const el = document.querySelector('.msg[data-key="'+tempKey+'"]');
      if(el){
        el.setAttribute('data-key', key);
        el.classList.remove('pending');
        const st = el.querySelector('.send-status');
        if(st) st.remove();
      }
    }
    if(msg.createdAt > (lastMsgTs||0)) lastMsgTs = msg.createdAt;
  }catch(e){
    toast('Не отправлено: '+e.message);
    // помечаем ошибку
    const el = document.querySelector('.msg[data-key="'+tempKey+'"]');
    if(el){
      el.classList.add('failed');
      const st = el.querySelector('.send-status');
      if(st) st.textContent = 'ошибка';
    }
    messages = messages.filter(m => m.key !== tempKey);
  }finally{
    btn.disabled=false;
  }
}

function markPending(key, on){
  const el = document.querySelector('.msg[data-key="'+key+'"]');
  if(!el) return;
  if(on){
    el.classList.add('pending');
    if(!el.querySelector('.send-status')){
      const s = document.createElement('span');
      s.className = 'send-status';
      s.textContent = '…';
      const head = el.querySelector('.head');
      if(head) head.appendChild(s);
    }
  }
}

function onComposerKey(e){ if(e.key==='Enter'&&!e.shiftKey){ e.preventDefault(); sendMessage(); } }
function autoGrow(el){ el.style.height='auto'; el.style.height=Math.min(el.scrollHeight,140)+'px'; }

function onFileSelected(e){
  const f=e.target.files&&e.target.files[0]; if(!f) return;
  if(f.size>1.5*1024*1024){ toast('Макс 1.5 MB'); e.target.value=''; return; }
  const reader=new FileReader();
  reader.onload=()=>{ pendingAttach={ type:f.type, name:f.name, size:f.size, dataUrl:reader.result }; renderAttachPreview(); };
  reader.readAsDataURL(f); e.target.value='';
}
function renderAttachPreview(){
  const box=$('attachPreview');
  if(!pendingAttach){ box.innerHTML=''; return; }
  const isImg=pendingAttach.type.indexOf('image/')===0;
  box.innerHTML='<div class="ap">'+(isImg?'<img src="'+pendingAttach.dataUrl+'"/>':'<div style="display:grid;place-items:center;height:100%;font-size:10px;color:var(--mu)">FILE</div>')+'<button class="rm" onclick="clearAttach()">×</button></div>';
}
function clearAttach(){ pendingAttach=null; renderAttachPreview(); }

async function loadOnline(){
  try{
    const all=await fbGet('users')||{};
    const list=Object.entries(all).map(([id,u])=>({id,...u})).filter(u=>(u.status||'')==='online'||(u.lastLogin&&Date.now()-u.lastLogin<5*60*1000));
    list.sort((a,b)=>(a.displayName||a.username||'').localeCompare(b.displayName||b.username||''));
    $('memberCount').textContent=list.length;
    $('membersList').innerHTML=list.map(u=>{
      const av=u.avatar||('https://api.dicebear.com/7.x/identicon/svg?seed='+encodeURIComponent(u.id));
      const role=(u.username||'').toLowerCase()===OWNER_NICK.toLowerCase()?'owner':'';
      return '<div class="mem-item"><div class="av"><img src="'+esc(av)+'" alt=""/><span class="dot" style="background:var(--online)"></span></div><div style="min-width:0"><div class="nm">'+esc(u.displayName||u.username||u.id)+'</div>'+(role?'<div class="role">'+role+'</div>':'')+'</div></div>';
    }).join('');
  }catch(e){}
}

function openProfile(){
  $('profName').value=me.displayName||me.username||'';
  $('profAvatar').value=me.avatar||'';
  openModal('modalProfile');
}
async function saveProfile(){
  const displayName=$('profName').value.trim()||me.username||'User';
  const avatar=$('profAvatar').value.trim();
  try{
    await fbUpdate('users/'+me.uid, { displayName, avatar });
    me.displayName=displayName; me.avatar=avatar;
    $('myName').textContent=displayName;
    $('myAv').src=avatar||('https://api.dicebear.com/7.x/identicon/svg?seed='+encodeURIComponent(me.uid));
    closeModal('modalProfile'); toast('Сохранено');
  }catch(e){ toast(e.message); }
}

function openModal(id){ $(id).classList.add('on'); }
function closeModal(id){ $(id).classList.remove('on'); }

document.addEventListener('keydown', e=>{
  if(e.key==='Enter'&&$('authScreen').style.display!=='none'&&document.activeElement&&document.activeElement.tagName==='INPUT'){ e.preventDefault(); doAuth(); }
  if(e.key==='Escape'){ ['modalCreateChannel','modalProfile'].forEach(id=>{ if($(id).classList.contains('on')) closeModal(id); }); }
});

(async function init(){
  try{ if(await tryRestoreSession()) enterApp(); }catch(e){}
})();
</script>
